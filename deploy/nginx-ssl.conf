# nginx as the public edge (no Caddy): HTTP -> HTTPS redirect, TLS with a
# Let's Encrypt certificate mounted from the host's /etc/letsencrypt.
# Used by docker-compose.nginx.yml.

server {
  listen 80;
  listen [::]:80;
  server_name porikroma.huzaifaswe.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name porikroma.huzaifaswe.com;

  ssl_certificate     /etc/letsencrypt/live/porikroma.huzaifaswe.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/porikroma.huzaifaswe.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 20m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # nginx is the first hop here, so overwrite (don't append to) client-sent
  # forwarding headers; the API's per-IP rate limits then see the real IP.
  location ~ ^/(api|docs|redoc|openapi\.json) {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
