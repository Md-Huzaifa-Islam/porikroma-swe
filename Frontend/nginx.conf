# Behind another proxy (Caddy on the VPS) keep its scheme; otherwise use ours.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 20m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # The API and its docs are served by the FastAPI container.
  location ~ ^/(api|docs|redoc|openapi\.json) {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
  }

  # Fingerprinted build assets can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routing: unknown paths load the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
